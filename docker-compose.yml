services:
  backend:
    build:
      context: ./ml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    env_file:
      - ./ml/.env
    environment:
      - DATA_ROOT=/data
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
